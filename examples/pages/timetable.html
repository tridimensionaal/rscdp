<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Workshop timetable</title>
<style>
  body { margin: 0; padding: 2rem; font: 18px system-ui; background: rgb(255, 255, 255); color: rgb(32, 40, 48); }
  main { max-width: 56rem; margin: auto; }
  #sessions { display: grid; grid-template-columns: 1fr; gap: 1rem; }
  article { padding: 1rem; border: 1px solid currentColor; border-radius: .5rem; }
  h2 { margin-top: 0; }
  @media (min-width: 700px) {
    #sessions { grid-template-columns: repeat(2, 1fr); }
  }
  @media (prefers-color-scheme: dark) {
    body { background: rgb(24, 32, 40); color: rgb(240, 244, 248); }
  }
</style>
<main>
  <h1>Workshop timetable</h1>
  <p>Make time for something new this evening.</p>
  <section id="sessions" aria-label="Evening workshops">
    <article><h2>Bookbinding</h2><p>18:00 · Studio one</p></article>
    <article><h2>Ceramics</h2><p>19:00 · Studio two</p></article>
  </section>
</main>
</html>
