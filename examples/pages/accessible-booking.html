<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Accessible workshop booking</title>
<style>
  body { max-width: 36rem; margin: 4rem auto; font: 18px system-ui; color: #23313d; }
  label { display: block; margin: 1.5rem 0; }
  input, button { font: inherit; }
  button { padding: .5rem; }
  output { display: block; margin-top: 1rem; }
</style>
<h1>Book a workshop</h1>
<form>
  <label for="name">Name</label>
  <input id="name" value="Lucía">
  <label><input id="receipt" type="checkbox" checked> Email booking receipt</label>
  <button type="submit">Book workshop</button>
</form>
<p>
  <button id="timetable" type="button"><span aria-hidden="true">▦</span></button>
  <button id="repair-label" type="button">Label timetable button</button>
</p>
<output id="status" aria-live="polite"></output>
<script>
  document.querySelector('form').addEventListener('submit', event => {
    event.preventDefault();
    document.querySelector('#status').textContent = 'Workshop booked';
  });
  document.querySelector('#timetable').addEventListener('click', () => {
    document.querySelector('#status').textContent = 'Bookbinding at 18:00; ceramics at 19:00';
  });
  document.querySelector('#repair-label').addEventListener('click', () => {
    document.querySelector('#timetable').setAttribute('aria-label', 'View timetable');
    document.querySelector('#status').textContent = 'Timetable button labelled';
  });
</script>
</html>
