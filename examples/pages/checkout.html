<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Paper shop</title>
  </head>
  <body>
    <h1>Paper shop — checkout</h1>
    <p>Field notebook · $12</p>
    <form onsubmit="event.preventDefault(); document.querySelector('output').textContent =
      'Reserved for ' + this.customer.value + ': ' + this.note.value">
      <label>Name <input name="customer" value="Guest" required></label>
      <label>Gift note <input name="note"></label>
      <button>Reserve notebook</button>
    </form>
    <output aria-live="polite"></output>
  </body>
</html>
