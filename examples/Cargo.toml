[package]
name = "rustcdp-examples"
version = "0.0.0"
edition = "2024"
rust-version = "1.99.1"
publish = false

[dev-dependencies]
rustcdp = { path = "../rustcdp" }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time", "fs", "net"] }
serde_json = "1.0.154"
url = "2.5.8"
axum = { version = "0.8.9", default-features = false, features = ["tokio", "http1"] }
tower-http = { version = "0.7.1", features = ["fs"] }

[[example]]
name = "checkout"
path = "checkout.rs"

[[example]]
name = "event_watch"
path = "event_watch.rs"

[[example]]
name = "frame_walk"
path = "frame_walk.rs"

[[example]]
name = "page_report"
path = "page_report.rs"

[[example]]
name = "browser_contexts"
path = "browser_contexts.rs"
