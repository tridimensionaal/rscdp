[package]
name = "rustcdp-examples"
version = "0.0.0"
edition = "2024"
rust-version = "1.99.1"
publish = false

[dev-dependencies]
rustcdp = { path = "../rustcdp" }
tokio = { version = "1.54.0", features = ["rt-multi-thread", "macros", "time", "fs"] }
serde_json = "1.0.154"
percent-encoding = "2.3.2"

[[example]]
name = "checkout"
path = "checkout.rs"

[[example]]
name = "event_watch"
path = "event_watch.rs"

[[example]]
name = "frame_walk"
path = "frame_walk.rs"

[[example]]
name = "page_report"
path = "page_report.rs"
