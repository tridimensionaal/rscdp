[package]
name = "rustcdp"
version = "0.1.0"
edition = "2024"
include = ["/src/**", "/examples/**", "/protocol/**", "/build.rs", "/Cargo.toml", "/Cargo.lock", "/README.md"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[build-dependencies]
heck = "0.5"
serde_json = "1"
