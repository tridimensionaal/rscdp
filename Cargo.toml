[package]
name = "rustcdp"
version = "0.1.0"
edition = "2024"
include = ["/src/**", "/examples/**", "/protocol/**", "/build.rs", "/Cargo.toml", "/Cargo.lock", "/README.md"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
futures-util = { version = "0.3", features = ["sink"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "process", "fs", "io-util"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
tempfile = "3"

[build-dependencies]
heck = "0.5"
serde_json = "1"
