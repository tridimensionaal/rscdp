[package]
name = "rustcdp"
version = "0.1.0"
description = "Asynchronous Chrome DevTools Protocol client and browser automation"
repository = "https://github.com/tridimensionaal/rustcdp"
keywords = ["cdp", "chrome", "browser", "automation"]
edition = "2024"
rust-version = "1.99.1"
readme = "../README.md"
include = ["/src/**", "/codegen/**", "/protocol/**", "/build.rs", "/Cargo.toml"]

[features]
default = []
tracing = ["dep:tracing"]

[dependencies]
base64 = "0.23.1"
tracing = { version = "0.1.44", optional = true, default-features = false, features = ["std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
futures-util = { version = "0.3.34", features = ["sink"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
tokio = { version = "1.54.0", features = ["rt", "macros", "sync", "time", "fs"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
tempfile = "3.27.0"
url = "2.5.8"
percent-encoding = "2.3.2"

[build-dependencies]
heck = "0.5.0"
serde_json = "1.0.154"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.5", features = ["process"] }
